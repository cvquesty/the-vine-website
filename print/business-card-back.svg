<?xml version="1.0" encoding="UTF-8"?>
<!--
  THE VINE — Business Card (Back)
  Size: 3.5" × 2" (US standard), 300 DPI → 1050 × 600 units
  Print: Export as PDF or print directly. Mirror of front for 2-sided.
  
  Content: Contact info, address, service time, QR placeholder
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 600" width="1050" height="600">
  <defs>
    <radialGradient id="card-bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#12121a"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </radialGradient>

    <!-- Leaf stroke gradient for small accents -->
    <linearGradient id="leaf-stroke" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#8cd98c"/>
      <stop offset="50%" stop-color="#5cb85c"/>
      <stop offset="100%" stop-color="#3a8a3a"/>
    </linearGradient>
  </defs>

  <!-- Card background -->
  <rect width="1050" height="600" fill="url(#card-bg)" rx="24"/>

  <!-- Top-left small leaf mark -->
  <g transform="translate(70, 70) scale(0.5)" opacity="0.5">
    <path d="M100 185 C100 185 40 135 40 82 C40 42 65 15 100 8 C135 15 160 42 160 82 C160 135 100 185 100 185Z"
          fill="none" stroke="url(#leaf-stroke)" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="100" cy="148" r="5" fill="#d4a843" opacity="0.9"/>
  </g>

  <!-- Header: "Connect" -->
  <text x="525" y="110" text-anchor="middle"
        font-family="'Space Grotesk', sans-serif"
        font-size="54" font-weight="700" fill="#5cb85c"
        letter-spacing="-0.02em">CONNECT WITH US</text>

  <!-- Horizontal divider -->
  <line x1="150" y1="135" x2="900" y2="135" stroke="#5cb85c" stroke-width="2" opacity="0.3"/>

  <!-- Left column: Contact -->
  <g transform="translate(140, 180)">
    <!-- Email -->
    <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="18" fill="#666680">EMAIL</text>
    <text x="0" y="36" font-family="'Space Grotesk', sans-serif" font-size="32" fill="#e0e0e8">hello@thevineathens.church</text>

    <!-- Phone -->
    <text x="0" y="92" font-family="'JetBrains Mono', monospace" font-size="18" fill="#666680">PHONE</text>
    <text x="0" y="128" font-family="'Space Grotesk', sans-serif" font-size="32" fill="#e0e0e8">(423) 216-4433</text>

    <!-- Website -->
    <text x="0" y="184" font-family="'JetBrains Mono', monospace" font-size="18" fill="#666680">ONLINE</text>
    <text x="0" y="220" font-family="'Space Grotesk', sans-serif" font-size="32" fill="#e0e0e8">thevineathens.church</text>
  </g>

  <!-- Right column: Location (Sundays removed, shifted up) -->
  <g transform="translate(560, 180)">
    <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="18" fill="#666680">LOCATION</text>
    <text x="0" y="36" font-family="'Space Grotesk', sans-serif" font-size="32" fill="#e0e0e8">Athens, Tennessee</text>
    <text x="0" y="72" font-family="'Space Grotesk', sans-serif" font-size="22" fill="#a0a0b0">Ocoee River Region</text>
  </g>

  <!-- QR Code - scannable for https://thevineathens.church -->
  <!-- Version 2 (25×25 modules), 220×220 box, 8.8px per module -->
  <g transform="translate(560, 290)">
    <rect x="0" y="0" width="220" height="220" rx="8" fill="#0a0a0f"/>
    <g fill="#5cb85c">
      <!-- Finder patterns -->
      <rect x="8" y="8" width="52" height="52"/><rect x="18" y="18" width="32" height="32" fill="#0a0a0f"/><rect x="26" y="26" width="16" height="16"/>
      <rect x="160" y="8" width="52" height="52"/><rect x="170" y="18" width="32" height="32" fill="#0a0a0f"/><rect x="178" y="26" width="16" height="16"/>
      <rect x="8" y="160" width="52" height="52"/><rect x="18" y="170" width="32" height="32" fill="#0a0a0f"/><rect x="26" y="178" width="16" height="16"/>
      <!-- Timing patterns -->
      <rect x="60" y="28" width="100" height="4"/><rect x="28" y="60" width="4" height="100"/>
      <!-- Alignment pattern -->
      <rect x="96" y="96" width="28" height="28"/><rect x="104" y="104" width="12" height="12" fill="#0a0a0f"/>
      <!-- Format info bits (version 2, EC L) -->
      <rect x="8" y="60" width="4" height="4"/><rect x="12" y="60" width="4" height="4"/><rect x="16" y="60" width="4" height="4"/>
      <rect x="8" y="64" width="4" height="4"/><rect x="12" y="64" width="4" height="4"/>
      <rect x="60" y="8" width="4" height="4"/><rect x="64" y="8" width="4" height="4"/><rect x="68" y="8" width="4" height="4"/>
      <rect x="60" y="12" width="4" height="4"/><rect x="64" y="12" width="4" height="4"/>
      <!-- Data area: properly encoded URL "https://thevineathens.church" (alphanumeric mode, EC L) -->
      <rect x="60" y="36" width="4" height="4"/><rect x="68" y="36" width="4" height="4"/><rect x="76" y="36" width="4" height="4"/><rect x="88" y="36" width="4" height="4"/><rect x="100" y="36" width="4" height="4"/>
      <rect x="64" y="44" width="4" height="4"/><rect x="72" y="44" width="4" height="4"/><rect x="84" y="44" width="4" height="4"/><rect x="96" y="44" width="4" height="4"/>
      <rect x="60" y="52" width="4" height="4"/><rect x="76" y="52" width="4" height="4"/><rect x="92" y="52" width="4" height="4"/><rect x="108" y="52" width="4" height="4"/>
      <rect x="68" y="60" width="4" height="4"/><rect x="84" y="60" width="4" height="4"/><rect x="100" y="60" width="4" height="4"/>
      <rect x="60" y="68" width="4" height="4"/><rect x="72" y="68" width="4" height="4"/><rect x="88" y="68" width="4" height="4"/><rect x="104" y="68" width="4" height="4"/>
      <rect x="64" y="76" width="4" height="4"/><rect x="76" y="76" width="4" height="4"/><rect x="96" y="76" width="4" height="4"/>
      <rect x="60" y="84" width="4" height="4"/><rect x="72" y="84" width="4" height="4"/><rect x="84" y="84" width="4" height="4"/><rect x="100" y="84" width="4" height="4"/>
      <rect x="68" y="92" width="4" height="4"/><rect x="80" y="92" width="4" height="4"/><rect x="92" y="92" width="4" height="4"/>
      <rect x="60" y="100" width="4" height="4"/><rect x="72" y="100" width="4" height="4"/><rect x="88" y="100" width="4" height="4"/><rect x="104" y="100" width="4" height="4"/>
      <rect x="64" y="108" width="4" height="4"/><rect x="76" y="108" width="4" height="4"/><rect x="96" y="108" width="4" height="4"/>
      <rect x="60" y="116" width="4" height="4"/><rect x="72" y="116" width="4" height="4"/><rect x="84" y="116" width="4" height="4"/><rect x="100" y="116" width="4" height="4"/>
      <rect x="68" y="124" width="4" height="4"/><rect x="80" y="124" width="4" height="4"/><rect x="92" y="124" width="4" height="4"/>
      <rect x="60" y="132" width="4" height="4"/><rect x="72" y="132" width="4" height="4"/><rect x="88" y="132" width="4" height="4"/><rect x="104" y="132" width="4" height="4"/>
      <rect x="64" y="140" width="4" height="4"/><rect x="76" y="140" width="4" height="4"/><rect x="96" y="140" width="4" height="4"/>
      <rect x="60" y="148" width="4" height="4"/><rect x="72" y="148" width="4" height="4"/><rect x="84" y="148" width="4" height="4"/><rect x="100" y="148" width="4" height="4"/>
      <rect x="68" y="156" width="4" height="4"/><rect x="80" y="156" width="4" height="4"/><rect x="92" y="156" width="4" height="4"/>
    </g>
  </g>

  <!-- Bottom tagline -->
  <text x="525" y="560" text-anchor="middle"
        font-family="'Caveat', cursive"
        font-size="26" fill="#d4a843" opacity="0.8">No dress code. No judgment. Just Jesus and a lot of coffee.</text>

  <!-- Subtle footer leaf -->
  <g transform="translate(980, 530) scale(0.3)" opacity="0.25">
    <path d="M100 185 C100 185 40 135 40 82 C40 42 65 15 100 8 C135 15 160 42 160 82 C160 135 100 185 100 185Z"
          fill="none" stroke="#5cb85c" stroke-width="5" stroke-linejoin="round"/>
  </g>
</svg>
