<?xml version="1.0" encoding="UTF-8"?>
<!--
  THE VINE — Business Card (Front)
  Size: 3.5" × 2" (US standard), 300 DPI → 1050 × 600 units
  Print: Export as PDF or print directly from browser/Illustrator/Inkscape
  Bleed: None (add 1/8" bleed in printer if needed)
  
  Colors:
    Background: #0a0a0f
    Green: #5cb85c
    Amber: #d4a843
    Text: #e0e0e8 / #a0a0b0 / #666680
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 600" width="1050" height="600">
  <defs>
    <!-- Background gradient (subtle vignette) -->
    <radialGradient id="card-bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#12121a"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </radialGradient>

    <!-- Logo gradients (copied from logo-horizontal) -->
    <linearGradient id="leaf-stroke" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#8cd98c"/>
      <stop offset="50%" stop-color="#5cb85c"/>
      <stop offset="100%" stop-color="#3a8a3a"/>
    </linearGradient>
    <linearGradient id="title-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8cd98c"/>
      <stop offset="50%" stop-color="#5cb85c"/>
      <stop offset="100%" stop-color="#3a8a3a"/>
    </linearGradient>
    <filter id="leaf-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur"/>
      <feFlood flood-color="#5cb85c" flood-opacity="0.15"/>
      <feComposite in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="amber-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Card background -->
  <rect width="1050" height="600" fill="url(#card-bg)" rx="24"/>

  <!-- Subtle circuit grid pattern (faint) -->
  <g opacity="0.06" stroke="#5cb85c" stroke-width="1">
    <line x1="0" y1="150" x2="1050" y2="150"/>
    <line x1="0" y1="300" x2="1050" y2="300"/>
    <line x1="0" y1="450" x2="1050" y2="450"/>
    <line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="600" y1="0" x2="600" y2="600"/>
    <line x1="800" y1="0" x2="800" y2="600"/>
  </g>

  <!-- Centered logo (scaled for card) -->
  <!-- Leaf icon sized to fit above text without overlap -->
  <g transform="translate(590, 65)">
    <!-- Leaf outline (~200px tall, fits cleanly above text) -->
    <g transform="scale(1.0)">
      <path d="M100 185 C100 185 40 135 40 82 C40 42 65 15 100 8 C135 15 160 42 160 82 C160 135 100 185 100 185Z"
            fill="none" stroke="url(#leaf-stroke)" stroke-width="6" stroke-linejoin="round" filter="url(#leaf-glow)"/>
      <!-- Stem -->
      <line x1="100" y1="38" x2="100" y2="155" stroke="#5cb85c" stroke-width="4.5" stroke-linecap="round"/>
      <!-- Branches -->
      <path d="M100 62 C88 56 76 60 68 68" fill="none" stroke="#5cb85c" stroke-width="4" stroke-linecap="round"/>
      <path d="M100 92 C112 86 124 90 132 98" fill="none" stroke="#5cb85c" stroke-width="4" stroke-linecap="round"/>
      <path d="M100 122 C88 116 76 120 70 130" fill="none" stroke="#5cb85c" stroke-width="4" stroke-linecap="round"/>
      <!-- Circuit traces -->
      <path d="M68 68 L62 68 L62 58" fill="none" stroke="#5cb85c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.35"/>
      <path d="M132 98 L138 98 L138 108" fill="none" stroke="#5cb85c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.35"/>
      <path d="M70 130 L64 130 L64 140" fill="none" stroke="#5cb85c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.35"/>
      <!-- Junction nodes -->
      <circle cx="100" cy="62" r="5" fill="#5cb85c" opacity="0.6"/>
      <circle cx="100" cy="92" r="5" fill="#5cb85c" opacity="0.6"/>
      <circle cx="100" cy="122" r="5" fill="#5cb85c" opacity="0.6"/>
      <!-- Amber fruit -->
      <circle cx="100" cy="148" r="6" fill="#d4a843" filter="url(#amber-glow)" opacity="0.95"/>
    </g>
  </g>

  <!-- "the" prefix -->
  <text x="525" y="320" text-anchor="middle"
        font-family="'JetBrains Mono', 'Fira Code', monospace"
        font-size="42" font-weight="300" fill="#a0a0b0" letter-spacing="0.4em">the</text>

  <!-- "vine" title -->
  <text x="525" y="410" text-anchor="middle"
        font-family="'Space Grotesk', sans-serif"
        font-size="112" font-weight="700" fill="url(#title-grad)"
        letter-spacing="-0.04em">vine</text>

  <!-- Tagline -->
  <text x="525" y="480" text-anchor="middle"
        font-family="'Caveat', cursive"
        font-size="36" fill="#d4a843" opacity="0.9">where misfits find family</text>

  <!-- Website (bottom) -->
  <text x="525" y="530" text-anchor="middle"
        font-family="'JetBrains Mono', monospace"
        font-size="22" fill="#666680" letter-spacing="0.08em">thevineathens.church</text>

  <!-- Corner accent: small leaf icon -->
  <g transform="translate(60, 60) scale(0.35)" opacity="0.3">
    <path d="M100 185 C100 185 40 135 40 82 C40 42 65 15 100 8 C135 15 160 42 160 82 C160 135 100 185 100 185Z"
          fill="none" stroke="#5cb85c" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="100" cy="148" r="5" fill="#d4a843" opacity="0.7"/>
  </g>
  <g transform="translate(990, 540) scale(0.35)" opacity="0.3">
    <path d="M100 185 C100 185 40 135 40 82 C40 42 65 15 100 8 C135 15 160 42 160 82 C160 135 100 185 100 185Z"
          fill="none" stroke="#5cb85c" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="100" cy="148" r="5" fill="#d4a843" opacity="0.7"/>
  </g>
</svg>
