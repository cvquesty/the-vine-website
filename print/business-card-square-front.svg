<?xml version="1.0" encoding="UTF-8"?>
<!--
  THE VINE — Business Card (Front, Square)
  Size: 2.5" × 2.5" (square), 300 DPI → 750 × 750 units
  Print: Export as PDF or print directly. Rounded corners for modern look.
  
  Design: Same motif as website — dark bg, vine green #5cb85c, amber #d4a843
  Logo: Horizontal lockup centered, with leaf-circuit mark
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 750" width="750" height="750">
  <defs>
    <!-- Background gradient -->
    <radialGradient id="sq-bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#12121a"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </radialGradient>

    <!-- Leaf stroke gradient -->
    <linearGradient id="sq-leaf-stroke" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#8cd98c"/>
      <stop offset="50%" stop-color="#5cb85c"/>
      <stop offset="100%" stop-color="#3a8a3a"/>
    </linearGradient>

    <!-- Title gradient -->
    <linearGradient id="sq-title-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8cd98c"/>
      <stop offset="50%" stop-color="#5cb85c"/>
      <stop offset="100%" stop-color="#3a8a3a"/>
    </linearGradient>

    <!-- Amber glow -->
    <filter id="sq-amber-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Leaf glow -->
    <filter id="sq-leaf-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feFlood flood-color="#5cb85c" flood-opacity="0.1"/>
      <feComposite in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Card background with rounded corners -->
  <rect width="750" height="750" fill="url(#sq-bg)" rx="48"/>

  <!-- Logo horizontal lockup - centered -->
  <g transform="translate(375, 220) scale(1.1)">
    <!-- Leaf icon (scaled from 200×200 viewBox) -->
    <g transform="translate(-100, -100)">
      <!-- Leaf shape -->
      <path 
        d="M100 185 C100 185 40 135 40 82 C40 42 65 15 100 8 C135 15 160 42 160 82 C160 135 100 185 100 185Z" 
        fill="none" 
        stroke="url(#sq-leaf-stroke)" 
        stroke-width="5" 
        stroke-linejoin="round"
        filter="url(#sq-leaf-glow)"
      />
      <!-- Central vine stem -->
      <line x1="100" y1="38" x2="100" y2="155" stroke="#5cb85c" stroke-width="3.5" stroke-linecap="round"/>
      <!-- Branches -->
      <path d="M100 62  C88 56  76 60  68 68" fill="none" stroke="#5cb85c" stroke-width="3" stroke-linecap="round"/>
      <path d="M100 92  C112 86  124 90  132 98" fill="none" stroke="#5cb85c" stroke-width="3" stroke-linecap="round"/>
      <path d="M100 122 C88 116 76 120 70 130" fill="none" stroke="#5cb85c" stroke-width="3" stroke-linecap="round"/>
      <!-- Circuit traces -->
      <path d="M68 68  L62 68  L62 58" fill="none" stroke="#5cb85c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.35"/>
      <path d="M132 98 L138 98 L138 108" fill="none" stroke="#5cb85c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.35"/>
      <path d="M70 130 L64 130 L64 140" fill="none" stroke="#5cb85c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.35"/>
      <!-- Nodes -->
      <circle cx="100" cy="62"  r="4" fill="#5cb85c" opacity="0.6"/>
      <circle cx="100" cy="92"  r="4" fill="#5cb85c" opacity="0.6"/>
      <circle cx="100" cy="122" r="4" fill="#5cb85c" opacity="0.6"/>
      <circle cx="68"  cy="68"  r="3" fill="#5cb85c" opacity="0.4"/>
      <circle cx="132" cy="98"  r="3" fill="#5cb85c" opacity="0.4"/>
      <circle cx="70"  cy="130" r="3" fill="#5cb85c" opacity="0.4"/>
      <!-- Circuit terminals -->
      <rect x="59" y="55" width="6" height="6" rx="1" fill="none" stroke="#5cb85c" stroke-width="1" opacity="0.3"/>
      <rect x="135" y="105" width="6" height="6" rx="1" fill="none" stroke="#5cb85c" stroke-width="1" opacity="0.3"/>
      <rect x="61" y="137" width="6" height="6" rx="1" fill="none" stroke="#5cb85c" stroke-width="1" opacity="0.3"/>
      <!-- Amber accent -->
      <circle cx="100" cy="148" r="5" fill="#d4a843" filter="url(#sq-amber-glow)" opacity="0.9"/>
    </g>
  </g>

  <!-- "the" text -->
  <text x="375" y="390" text-anchor="middle"
        font-family="'JetBrains Mono', monospace"
        font-size="52" font-weight="300" fill="#a0a0b0"
        letter-spacing="0.35em">the</text>

  <!-- "vine" text -->
  <text x="375" y="465" text-anchor="middle"
        font-family="'Space Grotesk', sans-serif"
        font-size="86" font-weight="700" fill="url(#sq-title-grad)"
        letter-spacing="-0.03em">vine</text>

  <!-- Tagline -->
  <text x="375" y="545" text-anchor="middle"
        font-family="'Caveat', cursive"
        font-size="32" font-weight="400" fill="#d4a843"
        opacity="0.85">where you already belong</text>

  <!-- Website URL -->
  <text x="375" y="605" text-anchor="middle"
        font-family="'JetBrains Mono', monospace"
        font-size="26" font-weight="400" fill="#666680"
        letter-spacing="0.05em">thevineathens.church</text>

  <!-- Subtle corner leaf accents -->
  <g transform="translate(55, 55) scale(0.25)" opacity="0.3">
    <path d="M100 185 C100 185 40 135 40 82 C40 42 65 15 100 8 C135 15 160 42 160 82 C160 135 100 185 100 185Z"
          fill="none" stroke="#5cb85c" stroke-width="5" stroke-linejoin="round"/>
  </g>
  <g transform="translate(695, 695) scale(0.25)" opacity="0.3">
    <path d="M100 185 C100 185 40 135 40 82 C40 42 65 15 100 8 C135 15 160 42 160 82 C160 135 100 185 100 185Z"
          fill="none" stroke="#5cb85c" stroke-width="5" stroke-linejoin="round"/>
  </g>
</svg>
