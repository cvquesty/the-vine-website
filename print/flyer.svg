<?xml version="1.0" encoding="UTF-8"?>
<!--
  THE VINE — Hand Flyer
  Size: 5.5" × 8.5" (half letter), 300 DPI → 1650 × 2550 units
  Print: Export as PDF or print directly. Same motif as website.
  
  Design: Dark bg, vine green #5cb85c, amber #d4a843, Space Grotesk / JetBrains Mono / Caveat
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1650 2550" width="1650" height="2550">
  <defs>
    <!-- Background gradient -->
    <radialGradient id="flyer-bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#12121a"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </radialGradient>

    <!-- Leaf gradient -->
    <linearGradient id="leaf-grad" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#8cd98c"/>
      <stop offset="50%" stop-color="#5cb85c"/>
      <stop offset="100%" stop-color="#3a8a3a"/>
    </linearGradient>

    <!-- Title gradient -->
    <linearGradient id="title-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8cd98c"/>
      <stop offset="50%" stop-color="#5cb85c"/>
      <stop offset="100%" stop-color="#3a8a3a"/>
    </linearGradient>

    <!-- River gradient -->
    <linearGradient id="river-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a5a8a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1a3a5a" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Amber glow -->
    <filter id="amber-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Leaf glow -->
    <filter id="leaf-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur"/>
      <feFlood flood-color="#5cb85c" flood-opacity="0.15"/>
      <feComposite in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1650" height="2550" fill="url(#flyer-bg)"/>

  <!-- ===== HEADER ===== -->
  <g transform="translate(0, 0)">
    <!-- Header bg band -->
    <rect width="1650" height="520" fill="#12121a"/>

    <!-- Logo icon centered -->
    <g transform="translate(825, 120) scale(0.85)">
      <!-- Leaf -->
      <path d="M100 185 C100 185 40 135 40 82 C40 42 65 15 100 8 C135 15 160 42 160 82 C160 135 100 185 100 185Z"
            fill="none" stroke="url(#leaf-grad)" stroke-width="8" stroke-linejoin="round"
            filter="url(#leaf-glow)"/>
      <!-- Stem -->
      <line x1="100" y1="38" x2="100" y2="155" stroke="#5cb85c" stroke-width="5" stroke-linecap="round"/>
      <!-- Branches -->
      <path d="M100 62 C88 56 76 60 68 68" fill="none" stroke="#5cb85c" stroke-width="4" stroke-linecap="round"/>
      <path d="M100 92 C112 86 124 90 132 98" fill="none" stroke="#5cb85c" stroke-width="4" stroke-linecap="round"/>
      <path d="M100 122 C88 116 76 120 70 130" fill="none" stroke="#5cb85c" stroke-width="4" stroke-linecap="round"/>
      <!-- Amber accent -->
      <circle cx="100" cy="148" r="7" fill="#d4a843" filter="url(#amber-glow)"/>
    </g>

    <!-- "the vine" -->
    <text x="825" y="245" text-anchor="middle"
          font-family="'JetBrains Mono', monospace"
          font-size="42" font-weight="400" fill="#666680"
          letter-spacing="0.35em">the vine</text>

    <!-- "THE VINE" title -->
    <text x="825" y="355" text-anchor="middle"
          font-family="'Space Grotesk', sans-serif"
          font-size="148" font-weight="700" fill="url(#title-grad)"
          letter-spacing="-0.03em">THE VINE</text>

    <!-- Tagline -->
    <text x="825" y="415" text-anchor="middle"
          font-family="'Caveat', cursive"
          font-size="66" font-weight="400" fill="#d4a843"
          opacity="0.9">Where Misfits Find Family</text>
  </g>

  <!-- ===== ILLUSTRATION (Ocoee River / Mountains) ===== -->
  <g transform="translate(0, 520)">
    <!-- Dark green bg -->
    <rect width="1650" height="480" fill="#0a0f0a"/>

    <!-- Mountains back layer -->
    <path d="M0,260 L180,150 L360,210 L600,105 L840,180 L1020,90 L1200,165 L1350,120 L1650,195 L1650,480 L0,480 Z"
          fill="#1a2a1a"/>
    <!-- Mountains front layer -->
    <path d="M0,315 L240,210 L480,255 L720,165 L960,225 L1200,180 L1440,240 L1650,195 L1650,480 L0,480 Z"
          fill="#2a3a2a"/>

    <!-- River -->
    <path d="M-30,330 Q300,300 600,345 Q900,315 1230,336 Q1500,300 1680,336"
          fill="none" stroke="url(#river-grad)" stroke-width="54" stroke-linecap="round"/>
    <path d="M-30,335 Q300,308 600,350 Q900,322 1230,342 Q1500,308 1680,342"
          fill="none" stroke="#4a7aa8" stroke-width="28" stroke-linecap="round" opacity="0.4"/>

    <!-- Church location pin -->
    <g transform="translate(825, 210)">
      <!-- Pin glow -->
      <circle r="30" fill="#5cb85c" opacity="0.25"/>
      <!-- Pin circle -->
      <circle r="15" fill="#5cb85c"/>
      <!-- Cross on pin -->
      <path d="M0,-9 L0,9" stroke="#0a0a0f" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M-6,0 L6,0" stroke="#0a0a0f" stroke-width="3.5" stroke-linecap="round"/>
    </g>

    <!-- Subtle river highlight -->
    <path d="M0,295 Q400,275 800,300 Q1200,280 1650,295"
          fill="none" stroke="#8cd98c" stroke-width="4" stroke-opacity="0.2"/>
  </g>

  <!-- ===== CONTENT ===== -->
  <g transform="translate(0, 1000)">
    <!-- Sundays intro -->
    <text x="100" y="60" font-family="'JetBrains Mono', monospace"
          font-size="28" fill="#5cb85c" letter-spacing="0.1em">// SUNDAYS AT 10:30AM</text>

    <text x="100" y="135" font-family="'Space Grotesk', sans-serif"
          font-size="72" font-weight="600" fill="#e0e0e8">No dress code. No judgment.<br/>Just Jesus and a lot of coffee.</text>

    <text x="100" y="240" font-family="'Space Grotesk', sans-serif"
          font-size="42" fill="#a0a0b0" line-height="1.7">
      We're a church for the rest of us — gamers, coders, bikers, creatives,<br/>
      and anyone who's ever felt like they don't fit the mold.<br/>
      Real faith. Real people. Real community.
    </text>

    <!-- Info grid -->
    <g transform="translate(100, 340)">
      <!-- WHEN -->
      <rect x="0" y="0" width="680" height="160" rx="16" fill="#12121a" stroke="#2a2a3a" stroke-width="2"/>
      <text x="32" y="48" font-family="'JetBrains Mono', monospace" font-size="26" fill="#5cb85c">WHEN</text>
      <text x="32" y="108" font-family="'Space Grotesk', sans-serif" font-size="44" fill="#e0e0e8">Sundays at 10:30am</text>

      <!-- WHERE -->
      <g transform="translate(720, 0)">
        <rect x="0" y="0" width="680" height="160" rx="16" fill="#12121a" stroke="#2a2a3a" stroke-width="2"/>
        <text x="32" y="48" font-family="'JetBrains Mono', monospace" font-size="26" fill="#5cb85c">WHERE</text>
        <text x="32" y="92" font-family="'Space Grotesk', sans-serif" font-size="44" fill="#e0e0e8">Athens, Tennessee</text>
        <text x="32" y="130" font-family="'Space Grotesk', sans-serif" font-size="34" fill="#a0a0b0">Ocoee River Region</text>
      </g>
    </g>

    <!-- Community section -->
    <text x="100" y="590" font-family="'JetBrains Mono', monospace"
          font-size="28" fill="#5cb85c" letter-spacing="0.1em">// FIND YOUR PEOPLE</text>

    <text x="100" y="665" font-family="'Space Grotesk', sans-serif"
          font-size="72" font-weight="600" fill="#e0e0e8">Community That Fits You</text>

    <!-- Groups grid (2 columns) -->
    <g transform="translate(100, 720)">
      <!-- Row 1 -->
      <g>
        <rect x="0" y="0" width="680" height="120" rx="12" fill="#12121a" stroke="#2a2a3a" stroke-width="1.5"/>
        <text x="28" y="40" font-family="'JetBrains Mono', monospace" font-size="26" fill="#5cb85c">RESPAWN</text>
        <text x="28" y="82" font-family="'Space Grotesk', sans-serif" font-size="32" fill="#e0e0e8">Friday night gaming &amp; tabletop</text>
      </g>
      <g transform="translate(720, 0)">
        <rect x="0" y="0" width="680" height="120" rx="12" fill="#12121a" stroke="#2a2a3a" stroke-width="1.5"/>
        <text x="28" y="40" font-family="'JetBrains Mono', monospace" font-size="26" fill="#5cb85c">TERMINAL</text>
        <text x="28" y="82" font-family="'Space Grotesk', sans-serif" font-size="32" fill="#e0e0e8">Wednesday morning code &amp; coffee</text>
      </g>

      <!-- Row 2 -->
      <g transform="translate(0, 140)">
        <rect x="0" y="0" width="680" height="120" rx="12" fill="#12121a" stroke="#2a2a3a" stroke-width="1.5"/>
        <text x="28" y="40" font-family="'JetBrains Mono', monospace" font-size="26" fill="#5cb85c">IRON HORSE</text>
        <text x="28" y="82" font-family="'Space Grotesk', sans-serif" font-size="32" fill="#e0e0e8">Saturday motorcycle rides</text>
      </g>
      <g transform="translate(720, 140)">
        <rect x="0" y="0" width="680" height="120" rx="12" fill="#12121a" stroke="#2a2a3a" stroke-width="1.5"/>
        <text x="28" y="40" font-family="'JetBrains Mono', monospace" font-size="26" fill="#5cb85c">BASECAMP</text>
        <text x="28" y="82" font-family="'Space Grotesk', sans-serif" font-size="32" fill="#e0e0e8">Monthly outdoor adventures</text>
      </g>

      <!-- Row 3 -->
      <g transform="translate(0, 280)">
        <rect x="0" y="0" width="680" height="120" rx="12" fill="#12121a" stroke="#2a2a3a" stroke-width="1.5"/>
        <text x="28" y="40" font-family="'JetBrains Mono', monospace" font-size="26" fill="#5cb85c">BRANCHES</text>
        <text x="28" y="82" font-family="'Space Grotesk', sans-serif" font-size="32" fill="#e0e0e8">Weekly discipleship groups</text>
      </g>
      <g transform="translate(720, 280)">
        <rect x="0" y="0" width="680" height="120" rx="12" fill="#12121a" stroke="#2a2a3a" stroke-width="1.5"/>
        <text x="28" y="40" font-family="'JetBrains Mono', monospace" font-size="26" fill="#5cb85c">AMPLIFIED</text>
        <text x="28" y="82" font-family="'Space Grotesk', sans-serif" font-size="32" fill="#e0e0e8">Thursday music &amp; worship</text>
      </g>
    </g>
  </g>

  <!-- ===== CTA FOOTER ===== -->
  <g transform="translate(0, 1990)">
    <!-- CTA bg -->
    <rect width="1650" height="340" fill="#12121a" stroke="#2a2a3a" stroke-width="1"/>

    <!-- Button -->
    <rect x="100" y="60" width="1450" height="120" rx="16" fill="#5cb85c"/>
    <text x="825" y="130" text-anchor="middle"
          font-family="'JetBrains Mono', monospace"
          font-size="48" font-weight="700" fill="#0a0a0f">Visit thevineathens.church</text>

    <!-- Help text -->
    <text x="825" y="240" text-anchor="middle"
          font-family="'Space Grotesk', sans-serif"
          font-size="34" fill="#666680">Questions? Text or call (423) 216-4433 — a real human will reply.</text>
  </g>

  <!-- ===== BOTTOM BAR ===== -->
  <g transform="translate(0, 2330)">
    <rect width="1650" height="220" fill="#0a0a0f" stroke="#2a2a3a" stroke-width="1"/>
    <text x="825" y="125" text-anchor="middle"
          font-family="'JetBrains Mono', monospace"
          font-size="28" fill="#666680"
          letter-spacing="0.05em">THE VINE CHURCH — ATHENS, TN • HELLO@THEVINEATHENS.CHURCH • THEVINEATHENS.CHURCH</text>
  </g>
</svg>
