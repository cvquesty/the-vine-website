<?xml version="1.0" encoding="UTF-8"?>
<!--
  THE VINE — Interest Form (Camera-Ready)
  Trim: 8.5" × 11" (letter) at 300 DPI → 2550 × 3300 units
  Bleed: 1/8" (37.5 units) on all sides → document 2625 × 3375
  Crop marks: included at trim corners
  
  Print workflow: Open in Illustrator/Inkscape → Export to PDF → Send to printer
  Fonts: Space Grotesk, JetBrains Mono, Caveat (must be installed or outline before print)
  
  Colors: #0a0a0f bg, #5cb85c green, #d4a843 amber, #e0e0e8 text
  Form fields: white fill (#ffffff) for handwritten legibility
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-37.5 -37.5 2625 3375" width="2625" height="3375">
  <defs>
    <!-- Background gradient -->
    <radialGradient id="form-bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#12121a"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </radialGradient>

    <!-- Leaf gradient -->
    <linearGradient id="form-leaf" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#8cd98c"/>
      <stop offset="50%" stop-color="#5cb85c"/>
      <stop offset="100%" stop-color="#3a8a3a"/>
    </linearGradient>

    <!-- Amber glow -->
    <filter id="form-amber-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Leaf glow -->
    <filter id="form-leaf-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur"/>
      <feFlood flood-color="#5cb85c" flood-opacity="0.15"/>
      <feComposite in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background (extended to bleed) -->
  <rect x="-37.5" y="-37.5" width="2625" height="3375" fill="url(#form-bg)"/>

  <!-- ===== HEADER ===== -->
  <g transform="translate(0, 0)">
    <!-- Header bar (extended to top bleed) -->
    <rect x="-37.5" y="-37.5" width="2625" height="337.5" fill="#12121a" stroke="#2a2a3a" stroke-width="2"/>

    <!-- Logo -->
    <g transform="translate(140, 80) scale(0.75)">
      <path d="M100 185 C100 185 40 135 40 82 C40 42 65 15 100 8 C135 15 160 42 160 82 C160 135 100 185 100 185Z"
            fill="none" stroke="url(#form-leaf)" stroke-width="8" stroke-linejoin="round"
            filter="url(#form-leaf-glow)"/>
      <line x1="100" y1="38" x2="100" y2="155" stroke="#5cb85c" stroke-width="5" stroke-linecap="round"/>
      <path d="M100 62 C88 56 76 60 68 68" fill="none" stroke="#5cb85c" stroke-width="4" stroke-linecap="round"/>
      <path d="M100 92 C112 86 124 90 132 98" fill="none" stroke="#5cb85c" stroke-width="4" stroke-linecap="round"/>
      <path d="M100 122 C88 116 76 120 70 130" fill="none" stroke="#5cb85c" stroke-width="4" stroke-linecap="round"/>
      <circle cx="100" cy="148" r="7" fill="#d4a843" filter="url(#form-amber-glow)"/>
    </g>

    <!-- Title + tagline -->
    <text x="280" y="115" font-family="'Space Grotesk', sans-serif"
          font-size="82" font-weight="700" fill="#5cb85c">THE VINE</text>
    <text x="280" y="200" font-family="'Caveat', cursive"
          font-size="52" fill="#d4a843" opacity="0.9">Where Misfits Find Family</text>
  </g>

  <!-- ===== INTRO ===== -->
  <g transform="translate(0, 340)">
    <text x="140" y="50" font-family="'JetBrains Mono', monospace"
          font-size="32" fill="#5cb85c" letter-spacing="0.1em">// SAY HELLO</text>

    <text x="140" y="115" font-family="'Space Grotesk', sans-serif"
          font-size="46" fill="#a0a0b0">We'd love to hear from you. No spam, no pressure — just a real person who cares.</text>
    <text x="140" y="175" font-family="'Space Grotesk', sans-serif"
          font-size="46" fill="#a0a0b0">Fill this out and we'll get back to you soon.</text>
  </g>

  <!-- ===== FORM FIELDS ===== -->
  <g transform="translate(0, 630)">
    <!-- Name + Phone row -->
    <g>
      <!-- Name -->
      <text x="140" y="0" font-family="'JetBrains Mono', monospace" font-size="30" fill="#a0a0b0">NAME</text>
      <rect x="140" y="30" width="1020" height="110" rx="14" fill="#ffffff" stroke="#2a2a3a" stroke-width="2"/>
      <text x="170" y="98" font-family="'Space Grotesk', sans-serif" font-size="42" fill="#666680" opacity="0.7">What should we call you?</text>

      <!-- Phone -->
      <text x="1230" y="0" font-family="'JetBrains Mono', monospace" font-size="30" fill="#a0a0b0">PHONE</text>
      <rect x="1230" y="30" width="1020" height="110" rx="14" fill="#ffffff" stroke="#2a2a3a" stroke-width="2"/>
      <text x="1260" y="98" font-family="'Space Grotesk', sans-serif" font-size="42" fill="#666680" opacity="0.7">(423) 555-1234</text>
    </g>

    <!-- Email -->
    <g transform="translate(0, 180)">
      <text x="140" y="0" font-family="'JetBrains Mono', monospace" font-size="30" fill="#a0a0b0">EMAIL</text>
      <rect x="140" y="30" width="2110" height="110" rx="14" fill="#ffffff" stroke="#2a2a3a" stroke-width="2"/>
      <text x="170" y="98" font-family="'Space Grotesk', sans-serif" font-size="42" fill="#666680" opacity="0.7">your@email.com</text>
    </g>

    <!-- Section: What brings you here? -->
    <g transform="translate(0, 430)">
      <text x="140" y="0" font-family="'JetBrains Mono', monospace" font-size="32" fill="#5cb85c" letter-spacing="0.1em">// WHAT BRINGS YOU HERE?</text>

      <!-- Checkbox grid 2×3 -->
      <!-- Row 1 -->
      <g transform="translate(140, 60)">
        <!-- Visiting -->
        <g>
          <rect x="0" y="0" width="990" height="140" rx="12" fill="#12121a" stroke="#2a2a3a" stroke-width="2"/>
          <rect x="28" y="28" width="36" height="36" rx="6" fill="#0a0a0f" stroke="#5cb85c" stroke-width="3"/>
          <text x="86" y="52" font-family="'Space Grotesk', sans-serif" font-size="38" fill="#e0e0e8">Visiting this Sunday</text>
          <text x="86" y="90" font-family="'Space Grotesk', sans-serif" font-size="28" fill="#666680">First time or coming back</text>
        </g>
        <!-- Groups -->
        <g transform="translate(1050, 0)">
          <rect x="0" y="0" width="990" height="140" rx="12" fill="#12121a" stroke="#2a2a3a" stroke-width="2"/>
          <rect x="28" y="28" width="36" height="36" rx="6" fill="#0a0a0f" stroke="#5cb85c" stroke-width="3"/>
          <text x="86" y="52" font-family="'Space Grotesk', sans-serif" font-size="38" fill="#e0e0e8">Finding a community group</text>
          <text x="86" y="90" font-family="'Space Grotesk', sans-serif" font-size="28" fill="#666680">Gaming, coffee, rides, worship, etc.</text>
        </g>
      </g>

      <!-- Row 2 -->
      <g transform="translate(140, 220)">
        <!-- Serving -->
        <g>
          <rect x="0" y="0" width="990" height="140" rx="12" fill="#12121a" stroke="#2a2a3a" stroke-width="2"/>
          <rect x="28" y="28" width="36" height="36" rx="6" fill="#0a0a0f" stroke="#5cb85c" stroke-width="3"/>
          <text x="86" y="52" font-family="'Space Grotesk', sans-serif" font-size="38" fill="#e0e0e8">Serving / volunteering</text>
          <text x="86" y="90" font-family="'Space Grotesk', sans-serif" font-size="28" fill="#666680">Help with events, tech, outreach</text>
        </g>
        <!-- Questions -->
        <g transform="translate(1050, 0)">
          <rect x="0" y="0" width="990" height="140" rx="12" fill="#12121a" stroke="#2a2a3a" stroke-width="2"/>
          <rect x="28" y="28" width="36" height="36" rx="6" fill="#0a0a0f" stroke="#5cb85c" stroke-width="3"/>
          <text x="86" y="52" font-family="'Space Grotesk', sans-serif" font-size="38" fill="#e0e0e8">Questions about faith</text>
          <text x="86" y="90" font-family="'Space Grotesk', sans-serif" font-size="28" fill="#666680">Just exploring, no pressure</text>
        </g>
      </g>

      <!-- Row 3 -->
      <g transform="translate(140, 380)">
        <!-- Prayer -->
        <g>
          <rect x="0" y="0" width="990" height="140" rx="12" fill="#12121a" stroke="#2a2a3a" stroke-width="2"/>
          <rect x="28" y="28" width="36" height="36" rx="6" fill="#0a0a0f" stroke="#5cb85c" stroke-width="3"/>
          <text x="86" y="52" font-family="'Space Grotesk', sans-serif" font-size="38" fill="#e0e0e8">Prayer request</text>
          <text x="86" y="90" font-family="'Space Grotesk', sans-serif" font-size="28" fill="#666680">We'd love to pray with you</text>
        </g>
        <!-- Something else -->
        <g transform="translate(1050, 0)">
          <rect x="0" y="0" width="990" height="140" rx="12" fill="#12121a" stroke="#2a2a3a" stroke-width="2"/>
          <rect x="28" y="28" width="36" height="36" rx="6" fill="#0a0a0f" stroke="#5cb85c" stroke-width="3"/>
          <text x="86" y="52" font-family="'Space Grotesk', sans-serif" font-size="38" fill="#e0e0e8">Something else</text>
          <text x="86" y="90" font-family="'Space Grotesk', sans-serif" font-size="28" fill="#666680">Tell us in the notes below</text>
        </g>
      </g>
    </g>

    <!-- Notes textarea -->
    <g transform="translate(0, 1020)">
      <text x="140" y="0" font-family="'JetBrains Mono', monospace" font-size="30" fill="#a0a0b0">// NOTES / MESSAGE</text>
      <rect x="140" y="30" width="2110" height="380" rx="14" fill="#ffffff" stroke="#2a2a3a" stroke-width="2"/>
      <text x="170" y="88" font-family="'Space Grotesk', sans-serif" font-size="42" fill="#666680" opacity="0.7">Anything else you'd like us to know? Questions, prayer requests,</text>
      <text x="170" y="138" font-family="'Space Grotesk', sans-serif" font-size="42" fill="#666680" opacity="0.7">or just saying hi…</text>
      <text x="140" y="515" font-family="'JetBrains Mono', monospace" font-size="32" fill="#5cb85c" letter-spacing="0.1em">// BRANCHES <tspan fill="#e0e0e8">- Community done different. Who are your "people"?</tspan></text>

      <!-- Branch checkboxes -->
      <!-- Row 1 -->
      <g transform="translate(140, 615)">
        <!-- TERMINAL -->
        <g>
          <rect x="0" y="0" width="650" height="140" rx="12" fill="#12121a" stroke="#2a2a3a" stroke-width="2"/>
          <rect x="28" y="28" width="36" height="36" rx="6" fill="#0a0a0f" stroke="#5cb85c" stroke-width="3"/>
          <text x="86" y="52" font-family="'Space Grotesk', sans-serif" font-size="38" fill="#e0e0e8">TERMINAL</text>
          <text x="86" y="90" font-family="'Space Grotesk', sans-serif" font-size="28" fill="#666680">Code and Coffee</text>
        </g>
        <!-- RESPAWN -->
        <g transform="translate(700, 0)">
          <rect x="0" y="0" width="650" height="140" rx="12" fill="#12121a" stroke="#2a2a3a" stroke-width="2"/>
          <rect x="28" y="28" width="36" height="36" rx="6" fill="#0a0a0f" stroke="#5cb85c" stroke-width="3"/>
          <text x="86" y="52" font-family="'Space Grotesk', sans-serif" font-size="38" fill="#e0e0e8">RESPAWN</text>
          <text x="86" y="90" font-family="'Space Grotesk', sans-serif" font-size="28" fill="#666680">Monthly Game Night</text>
        </g>
        <!-- BRANCHES -->
        <g transform="translate(1400, 0)">
          <rect x="0" y="0" width="650" height="140" rx="12" fill="#12121a" stroke="#2a2a3a" stroke-width="2"/>
          <rect x="28" y="28" width="36" height="36" rx="6" fill="#0a0a0f" stroke="#5cb85c" stroke-width="3"/>
          <text x="86" y="52" font-family="'Space Grotesk', sans-serif" font-size="38" fill="#e0e0e8">BRANCHES</text>
          <text x="86" y="90" font-family="'Space Grotesk', sans-serif" font-size="28" fill="#666680">Bible and Food</text>
        </g>
      </g>

      <!-- Row 2 -->
      <g transform="translate(140, 775)">
        <!-- SERVE -->
        <g>
          <rect x="0" y="0" width="650" height="140" rx="12" fill="#12121a" stroke="#2a2a3a" stroke-width="2"/>
          <rect x="28" y="28" width="36" height="36" rx="6" fill="#0a0a0f" stroke="#5cb85c" stroke-width="3"/>
          <text x="86" y="52" font-family="'Space Grotesk', sans-serif" font-size="38" fill="#e0e0e8">SERVE</text>
          <text x="86" y="90" font-family="'Space Grotesk', sans-serif" font-size="28" fill="#666680">Community Outreach</text>
        </g>
        <!-- BASECAMP -->
        <g transform="translate(700, 0)">
          <rect x="0" y="0" width="650" height="140" rx="12" fill="#12121a" stroke="#2a2a3a" stroke-width="2"/>
          <rect x="28" y="28" width="36" height="36" rx="6" fill="#0a0a0f" stroke="#5cb85c" stroke-width="3"/>
          <text x="86" y="52" font-family="'Space Grotesk', sans-serif" font-size="38" fill="#e0e0e8">BASECAMP</text>
          <text x="86" y="90" font-family="'Space Grotesk', sans-serif" font-size="28" fill="#666680">Outdoor Activities</text>
        </g>
        <!-- CONFIG -->
        <g transform="translate(1400, 0)">
          <rect x="0" y="0" width="650" height="140" rx="12" fill="#12121a" stroke="#2a2a3a" stroke-width="2"/>
          <rect x="28" y="28" width="36" height="36" rx="6" fill="#0a0a0f" stroke="#5cb85c" stroke-width="3"/>
          <text x="86" y="52" font-family="'Space Grotesk', sans-serif" font-size="38" fill="#e0e0e8">CONFIG</text>
          <text x="86" y="90" font-family="'Space Grotesk', sans-serif" font-size="28" fill="#666680">Free "Tech Help" Clinics</text>
        </g>
      </g>

      <!-- Row 3 -->
      <g transform="translate(140, 935)">
        <!-- AMPLIFIED -->
        <g>
          <rect x="0" y="0" width="650" height="140" rx="12" fill="#12121a" stroke="#2a2a3a" stroke-width="2"/>
          <rect x="28" y="28" width="36" height="36" rx="6" fill="#0a0a0f" stroke="#5cb85c" stroke-width="3"/>
          <text x="86" y="52" font-family="'Space Grotesk', sans-serif" font-size="38" fill="#e0e0e8">AMPLIFIED</text>
          <text x="86" y="90" font-family="'Space Grotesk', sans-serif" font-size="28" fill="#666680">Open Worship and Jam Night</text>
        </g>
        <!-- CHURCH2U -->
        <g transform="translate(700, 0)">
          <rect x="0" y="0" width="650" height="140" rx="12" fill="#12121a" stroke="#2a2a3a" stroke-width="2"/>
          <rect x="28" y="28" width="36" height="36" rx="6" fill="#0a0a0f" stroke="#5cb85c" stroke-width="3"/>
          <text x="86" y="52" font-family="'Space Grotesk', sans-serif" font-size="38" fill="#e0e0e8">CHURCH2U</text>
          <text x="86" y="90" font-family="'Space Grotesk', sans-serif" font-size="28" fill="#666680">Food Delivery and Cookouts</text>
        </g>
        <!-- ROOT ACCESS -->
        <g transform="translate(1400, 0)">
          <rect x="0" y="0" width="650" height="140" rx="12" fill="#12121a" stroke="#2a2a3a" stroke-width="2"/>
          <rect x="28" y="28" width="36" height="36" rx="6" fill="#0a0a0f" stroke="#5cb85c" stroke-width="3"/>
          <text x="86" y="52" font-family="'Space Grotesk', sans-serif" font-size="38" fill="#e0e0e8">ROOT ACCESS</text>
          <text x="86" y="90" font-family="'Space Grotesk', sans-serif" font-size="28" fill="#666680">Vine Men</text>
        </g>
      </g>
    </g>
  </g>

  <!-- ===== BOTTOM CONTACT ===== -->
  <g transform="translate(0, 3250)">
    <text x="1275" y="-15" text-anchor="middle"
          font-family="'Space Grotesk', sans-serif"
          font-size="38" fill="#666680">Or text/call us directly: <tspan font-weight="600" fill="#a0a0b0">(423) 216-4433</tspan></text>
    <text x="1275" y="20" text-anchor="middle"
          font-family="'Space Grotesk', sans-serif"
          font-size="36" fill="#666680">Athens, TN • thevineathens.church</text>
  </g>

  <!-- ===== CROP MARKS (trim corners) ===== -->
  <g stroke="#000000" stroke-width="1" fill="none">
    <!-- Top-left -->
    <path d="M-15,0 L0,0 L0,-15"/>
    <!-- Top-right -->
    <path d="M2550,-15 L2550,0 L2565,0"/>
    <!-- Bottom-left -->
    <path d="M-15,3300 L0,3300 L0,3315"/>
    <!-- Bottom-right -->
    <path d="M2550,3315 L2550,3300 L2565,3300"/>
  </g>
</svg>
